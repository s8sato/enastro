name: Deploy demo to GitHub Pages

# Builds fixtures/demo-vault with enastro and publishes it to this
# repository's own GitHub Pages site (ADR-0013). This is a self-demo only —
# it is unrelated to REQ-PUB-008 (private -> public auto-mirroring for end
# users), which remains DEFERRED. End users publishing their own vault
# should copy the reusable template documented in README.md instead.
#
# One-time manual step (cannot be done by an agent/workflow): enable
# "Settings -> Pages -> Source: GitHub Actions" on this repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA rather than a mutable tag
      # (supply chain hardening — see ci.yml for the rationale). Dependabot
      # (.github/dependabot.yml) keeps these pins up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (not the default shallow depth-1 clone) so that
          # each fixture note's displayed "Updated" date reflects its own
          # real last-commit date rather than being coarsened to this
          # repo's single most recent commit (REQ-UX-007, ADR-0015).
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node bin/enastro.mjs fixtures/demo-vault dist-demo
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
